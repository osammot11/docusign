server {
    listen 80;
    listen [::]:80;
    server_name docusign.produceavalue.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/docusign-acme;
        default_type text/plain;
    }
    location / { return 301 https://docusign.produceavalue.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docusign.produceavalue.com;
    ssl_certificate /etc/letsencrypt/live/docusign.produceavalue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docusign.produceavalue.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/docusign/public;
    index index.php;
    charset utf-8;
    client_max_body_size 28m;
    access_log off;
    error_log /var/log/nginx/docusign.produceavalue.com-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/docusign-fpm.sock;
        fastcgi_read_timeout 180;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
